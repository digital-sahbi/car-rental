{% load i18n %}
{% if form.non_field_errors %}
    <div class="alert alert--error">
        {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
    </div>
{% endif %}

{% for field in form %}
    <div class="field {% if field.errors %}field--error{% endif %}">
        <label for="{{ field.id_for_label }}">
            {{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}
        </label>
        {{ field }}
        {% if field.help_text %}<p class="field__help">{{ field.help_text }}</p>{% endif %}
        {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
    </div>
{% endfor %}
