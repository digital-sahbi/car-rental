<!DOCTYPE html>
<html>
<head>
    <title>Modifier réservation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        form { max-width: 400px; }
        input { display: block; width: 100%; margin-bottom: 12px; padding: 8px; }
        button { padding: 10px 14px; background: #0b5fff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Modifier la réservation</h2>
    <form method='post'>
        {% csrf_token %}
        <label>Départ</label>
        <input type='date' name='start_date' value='{{ booking.start_date|date:"Y-m-d" }}'>
        <label>Fin</label>
        <input type='date' name='end_date' value='{{ booking.end_date|date:"Y-m-d" }}'>
        <button type='submit'>Enregistrer</button>
        <a href="{% url 'booking_detail' booking.id %}">Annuler</a>
    </form>
</body>
</html>
