<!DOCTYPE html>
<html>
<head>
    <title>Détail réservation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .card { max-width: 600px; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .actions { margin-top: 20px; }
        button, a.button {
            display: inline-block;
            margin-right: 10px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #0b5fff;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .secondary { background: #666; }
        @media print {
            .actions { display: none; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Détail de la réservation</h2>
        <p><strong>Voiture :</strong> {{ booking.car.brand }} {{ booking.car.name }}</p>
        <p><strong>Utilisateur :</strong> {{ booking.user.username }}</p>
        <p><strong>Date de départ :</strong> {{ booking.start_date }}</p>
        <p><strong>Date de fin :</strong> {{ booking.end_date }}</p>
        <p><strong>Prix total :</strong> {{ booking.total_price }} €</p>

        <div class="actions">
            <button onclick="window.print()">Imprimer</button>
            <a class="button secondary" href="{% url 'booking_edit' booking.id %}">Modifier</a>
            <a class="button" href="{% url 'booking_list' %}">Retour</a>
        </div>
    </div>
</body>
</html>
